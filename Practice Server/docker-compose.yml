# Optional: run Postgres and Redis in Docker instead of installing it.
#   docker compose up -d
services:
  db:
    image: postgres:16
    container_name: practice_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: practice_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: practice_redis
    ports:
      - "6379:6379"

volumes:
  pgdata:
