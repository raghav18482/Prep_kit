# Optional: run Postgres in Docker instead of installing it.
#   docker compose up -d
services:
  db:
    image: postgres:16
    container_name: practice_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: practice_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
